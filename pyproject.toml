[project]
name = "wxclip"
version = "0.0.1"
description = "Capture, decode and download WeChat videos playable in the local WeChat client"
requires-python = ">=3.11"
dependencies = []
# Candidates are still open; see docs/开发计划.md and pin them as each milestone lands.

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
wxclip = "wxclip.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wxclip"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
