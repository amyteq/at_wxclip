[project]
name = "wxclip"
version = "0.0.1"
description = "Capture, decode and download WeChat videos playable in the local WeChat client"
requires-python = ">=3.11"
dependencies = []
# Candidates are still open; see docs/开发计划.md and pin them as each milestone lands.

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# The proxy needs a MITM engine that can rewrite response bodies; mitmproxy also
# manages the CA. Kept optional so the test suite and CI stay free of it.
proxy = ["mitmproxy>=11,<13"]

[project.scripts]
wxclip = "wxclip.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wxclip"]

# The hook script lives in web/ for people to read; a wheel carries a copy so the
# proxy can serve it when wxclip is installed rather than run from a checkout.
[tool.hatch.build.targets.wheel.force-include]
"web/inject.js" = "wxclip/_web/inject.js"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
