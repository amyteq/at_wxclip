[project]
name = "wx-dlh"
dynamic = ["version"]
description = "Capture, decrypt and download WeChat Channels videos playable in your own WeChat client"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harry Sun", email = "harrysun2006@gmail.com" }]
requires-python = ">=3.11"
# The only third-party runtime dependency, and on purpose: `capture` / `proxy` need a MITM
# engine that can rewrite response bodies, and mitmproxy also manages the CA. It is a
# default rather than an extra so that `pip install wx-dlh` is a working tool in one step.
# Everything else is the standard library or an external binary (ffmpeg, tesseract).
dependencies = ["mitmproxy>=11,<13"]
keywords = ["wechat", "weixin", "channels", "video", "downloader", "mitmproxy"]
# Only what has been run: Linux end to end, and the Python versions the wheel was installed
# and smoke-tested on. Widen these as macOS / Windows (#11) and newer Pythons get verified.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/amyteq/at_wxclip"
Issues = "https://github.com/amyteq/at_wxclip/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# There is deliberately no `summarize` extra: the anthropic SDK cannot be installed
# beside mitmproxy (it needs httpx2 -> httpcore2 -> h11>=0.16, which mitmproxy pins
# below), so it would not even resolve against wx-dlh's own dependency.
# It posts to the Messages API with stdlib urllib instead - see wx_dlh/summarize.py.

[project.scripts]
wx-dlh = "wx_dlh.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]  # 1.27: `license` as an SPDX expression and `license-files`
build-backend = "hatchling.build"

# One version, in wx_dlh/__init__.py: `wx-dlh --version`, the dashboard and the package
# metadata all read it, so a release bumps it in exactly one place.
[tool.hatch.version]
path = "wx_dlh/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["wx_dlh"]

# The hook script and the dashboard live in web/ for people to read; a wheel carries a
# copy of each so the proxy and the server can serve them when wx-dlh is installed
# rather than run from a checkout (see wx_dlh.inject.asset_source).
[tool.hatch.build.targets.wheel.force-include]
"web/inject.js" = "wx_dlh/_web/inject.js"
"web/dashboard.html" = "wx_dlh/_web/dashboard.html"
"web/dashboard.js" = "wx_dlh/_web/dashboard.js"

# An allowlist, not hatch's default. By default an sdist takes every file git does not
# ignore, and a working checkout collects untracked ones - agent config, scratch copies -
# that must never be uploaded (a default build here picked up a stray ~/.claude-* tree).
# This is what building the wheel and running the tests from the sdist need.
[tool.hatch.build.targets.sdist]
include = [
    "/wx_dlh",
    "/web/inject.js",
    "/web/dashboard.html",
    "/web/dashboard.js",
    "/tests",
    "/scripts",
    "/tools/check-inject.mjs",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
