[project]
name = "wxclip"
version = "0.0.1"
description = "Capture, decode and download WeChat videos playable in the local WeChat client"
requires-python = ">=3.11"
dependencies = []
# Candidates are still open; see docs/development-plan.md and pin them as each milestone lands.

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# The proxy needs a MITM engine that can rewrite response bodies; mitmproxy also
# manages the CA. Kept optional so the test suite and CI stay free of it.
proxy = ["mitmproxy>=11,<13"]
# There is deliberately no `summarize` extra: the anthropic SDK cannot be installed
# beside mitmproxy (it needs httpx2 -> httpcore2 -> h11>=0.16, which mitmproxy pins
# below), so `wxclip summarize` would not run in the same venv as `wxclip capture`.
# It posts to the Messages API with stdlib urllib instead - see wxclip/summarize.py.

[project.scripts]
wxclip = "wxclip.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wxclip"]

# The hook script and the dashboard live in web/ for people to read; a wheel carries a
# copy of each so the proxy and the server can serve them when wxclip is installed
# rather than run from a checkout (see wxclip.inject.asset_source).
[tool.hatch.build.targets.wheel.force-include]
"web/inject.js" = "wxclip/_web/inject.js"
"web/dashboard.html" = "wxclip/_web/dashboard.html"
"web/dashboard.js" = "wxclip/_web/dashboard.js"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
